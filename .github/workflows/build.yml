name: Compilar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4

      - name: Comprobar la firma fija
        run: |
          if [ ! -f app/radio.keystore ]; then
            echo "::error::Falta el archivo app/radio.keystore. Cópialo del repositorio de la Radio (carpeta app) a la carpeta app de este repositorio."
            exit 1
          fi

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Descargar la letra Barlow (licencia OFL)
        run: |
          mkdir -p muestra/src/main/assets/fonts app/src/main/assets/fonts
          cd muestra/src/main/assets/fonts
          B=https://cdn.jsdelivr.net/npm/@fontsource
          for w in 400 500 600 700; do curl -fsSL -o barlow-$w.woff2 $B/barlow@5/files/barlow-latin-$w-normal.woff2 || true; done
          for w in 600 700; do curl -fsSL -o barlowc-$w.woff2 $B/barlow-condensed@5/files/barlow-condensed-latin-$w-normal.woff2 || true; done
          cd ../../../../../app/src/main/assets/fonts
          G=https://raw.githubusercontent.com/google/fonts/main/ofl
          for f in barlow/Barlow-Regular barlow/Barlow-Medium barlow/Barlow-SemiBold barlow/Barlow-Bold barlowcondensed/BarlowCondensed-SemiBold barlowcondensed/BarlowCondensed-Bold; do
            curl -fsSL -o $(basename $f).ttf $G/$f.ttf || true
          done
          curl -fsSL -o OFL.txt $G/barlow/OFL.txt || true
          ls -l

      - name: Descargar las listas de radares e incluirlas en la app
        run: |
          set +e
          D=app/src/main/assets/radares
          mkdir -p $D /tmp/radares
          cd /tmp/radares
          ok=0
          # Radares Anunciados (incluye la DGT, Cataluña, País Vasco, Navarra y ayuntamientos)
          if curl -fsSL --retry 3 --max-time 180 -o feed.geojson https://geiserx.github.io/radares-anunciados-ha/feed.geojson \
             && python3 -c "import json,sys; n=len(json.load(open('feed.geojson'))['features']); print('feed:',n); sys.exit(0 if n>300 else 1)"; then
            cp feed.geojson $GITHUB_WORKSPACE/$D/radares_anunciados.geojson; ok=1
          else
            echo "::warning::No se pudo descargar Radares Anunciados; se usa la copia guardada"
          fi
          # DGT (plan B)
          for u in https://nap.dgt.es/datex2/dgt/PredefinedLocationsPublication/radares/content.xml https://infocar.dgt.es/datex2/dgt/PredefinedLocationsPublication/radares/content.xml; do
            if curl -fsSL --retry 2 --max-time 180 -o dgt.xml "$u" && [ $(stat -c%s dgt.xml) -gt 100000 ] && grep -q "predefinedLocation" dgt.xml; then
              cp dgt.xml $GITHUB_WORKSPACE/$D/radares_dgt.xml; ok=1; break
            fi
          done
          cd $GITHUB_WORKSPACE
          if [ $ok = 1 ]; then date -u +%Y-%m-%d > $D/fecha.txt; fi
          ls -l $D
          # Guarda en el repositorio la última copia buena (por si otro día falla la descarga).
          if [ -n "$(git status --porcelain $D)" ]; then
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add $D
            git commit -m "Listas de radares actualizadas" && git push || echo "::warning::No se pudo guardar la copia en el repositorio"
          fi

      - name: Compilar las APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk Launcher.apk
          cp muestra/build/outputs/apk/debug/muestra-debug.apk Muestra.apk
          cp escaner/build/outputs/apk/debug/escaner-debug.apk Escaner.apk

      - name: Guardar la APK en la ejecución
        uses: actions/upload-artifact@v4
        with:
          name: Launcher.apk
          path: |
            Launcher.apk
            Muestra.apk
            Escaner.apk

      - name: Publicar la APK como versión descargable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Launcher ${{ github.run_number }}
          files: |
            Launcher.apk
            Muestra.apk
            Escaner.apk
          make_latest: true
